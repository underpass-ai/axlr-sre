# The lab cluster: one control plane and two workers. The monitoring stack
# runs on the first worker (label lab/role=monitoring); node-notready stops
# the kubelet of the second, so the alert pipeline survives the fault.
#
# Workers need the host's fs.inotify.max_user_instances well above the
# default of 128: on gx10 a worker's kubelet failed with "inotify_init: too
# many open files" until
#   sudo sysctl -w fs.inotify.max_user_instances=1024
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-lab
nodes:
  - role: control-plane
  - role: worker
    labels:
      lab/role: monitoring
  - role: worker
    labels:
      lab/role: workloads
