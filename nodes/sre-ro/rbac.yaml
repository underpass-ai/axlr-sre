# The read-only identity of the node sre-ro (design §7.2): get, list and
# watch on what a diagnosis reads, and nothing on Secrets. RBAC cannot say
# "everything but secrets", so the resources are listed; a resource left
# out answers 403 to the bot, which is the safe failure.
apiVersion: v1
kind: Namespace
metadata:
  name: axlr-sre
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axlr-sre-read
  namespace: axlr-sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axlr-sre-read
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - nodes
      - namespaces
      - replicationcontrollers
      - serviceaccounts
      - resourcequotas
      - limitranges
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets, controllerrevisions]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests, issuers, clusterissuers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axlr-sre-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: axlr-sre-read
subjects:
  - kind: ServiceAccount
    name: axlr-sre-read
    namespace: axlr-sre
