[workspace]
resolver = "3"
members = ["mcp", "argo-workflows"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/underpass-ai/axlr-sre"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
url = "2"
wiremock = "0.6"
sre-mcp = { path = "mcp" }
