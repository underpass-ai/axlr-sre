[workspace]
resolver = "3"
members = ["mcp", "argo-workflows", "kube", "grafana", "opsgenie", "aws", "messaging", "postgres", "redis"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/underpass-ai/axlr-sre"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
jiff = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-io"] }
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
redis = { version = "0.27", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-insecure"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "process", "time"] }
url = "2"
wiremock = "0.6"
sre-mcp = { path = "mcp" }
