[package]
name = "redis-mcp"
description = "MCP server for one Redis or Valkey instance reached with the node's environment: INFO, slow log, clients, latency, memory, config, cluster, keys by SCAN with bounded previews and the biggest keys; and with REDIS_WRITES, expire, delete, config set and client kill with a preview first. Never FLUSH, SHUTDOWN, DEBUG or KEYS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "redis-mcp"
path = "src/bin/redis_mcp.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
redis.workspace = true
rustls.workspace = true
serde_json.workspace = true
sre-mcp.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
url.workspace = true
